name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish-api:
    name: Build & Push API Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger API deploy hook (optional)
        env:
          API_DEPLOY_HOOK_URL: ${{ secrets.API_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$API_DEPLOY_HOOK_URL" ]; then
            curl --fail --silent --show-error -X POST "$API_DEPLOY_HOOK_URL"
          else
            echo "API_DEPLOY_HOOK_URL not configured; skipping webhook."
          fi

  deploy-web:
    name: Build & Deploy Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: publish-api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pyneath/contracts build
      - run: pnpm --filter @pyneath/web build

      - name: Deploy Web to Vercel (when secrets configured)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            npx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
          else
            echo "Vercel secrets not configured; skipping Vercel deploy."
          fi

      - name: Write CD Summary
        run: |
          {
            echo "### Pyneath CD Summary"
            echo "- API image published to \`ghcr.io/${{ github.repository }}-api\`"
            echo "- Web bundle built successfully (\`apps/web/dist\`)"
          } >> "$GITHUB_STEP_SUMMARY"
